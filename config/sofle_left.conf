# Applied on top of sofle.conf, for the LEFT (central) half only.
# These symbols live inside `if ZMK_SPLIT_ROLE_CENTRAL`, so they must not be
# in the shared sofle.conf (would warn on the sofle_right build).

# Central fetches the peripheral's battery and re-publishes it as a second
# GATT Battery Service instance.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector status advertisement (telemetry over BLE advertisement)
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
# Must match the keyboard's BLE name: this option also overrides BT_DEVICE_NAME.
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Sofle"
# Sofle's central is the LEFT half
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
